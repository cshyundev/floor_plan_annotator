[project]
name = "floor-plan-annotator"
version = "0.1.0"
description = "3D to 2D Floor Plan Annotation Tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "open3d>=0.18.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "shapely>=2.0.0",
    "pyyaml>=6.0.3",
    "trimesh[easy]>=4.11.2",
]

[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
qt_api = "pyqt6"
testpaths = ["tests"]
markers = [
    "e2e: End-to-end tests that exercise real components",
]
