[project]
name = "floor-plan-annotator"
version = "0.1.0"
description = "3D to 2D Floor Plan Annotation Tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "open3d>=0.18.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "shapely>=2.0.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
