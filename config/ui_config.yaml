# UI Configuration
# This file contains all non-color UI settings including:
# - Dimensions (sizes in meters or pixels)
# - Behavior settings (zoom limits, snap tolerance, etc.)
# - Rendering order (z_values)
#
# For color settings, see colors.yaml

grid:
  width: 0  # Grid line width

canvas:
  min_zoom: 10.0   # Minimum zoom level (prevent zooming out too far)
  max_zoom: 80.0   # Maximum zoom level (prevent zooming in too far)

node:
  pen_width: 0.02       # Meters - node outline width in scene coordinates (2cm)
  radius: 0.1           # Meters - node display size in scene coordinates (10cm)
  z_value: 100          # Rendering layer order (higher = on top)
  snap_tolerance: 10    # Pixels - distance to snap to existing node
  hover:
    scale: 1.5          # Scale multiplier when hovering over node

wall:
  default:
    width: 0.04         # Meters - wall line width in scene coordinates (4cm)
  selected:
    width: 0.06         # Meters - selected wall line width (6cm)
  hover:
    width: 0.05         # Meters - hover wall line width (5cm)
    angle_threshold: 5.0 # Degrees - H/V detection threshold
  z_value: 50           # Rendering layer order

room:
  width: 0.04                   # Meters - room boundary line width in scene coordinates (4cm)
  z_value: 40                   # Rendering layer order
  rotation_handle_offset: 30    # Pixels - distance of rotation handle from centroid
  label_scale: 0.02             # Scale factor for room label text (smaller = smaller text)
  edge:
    width: 0.04                 # Meters - room edge line width (4cm)
    snap_tolerance: 15          # Pixels - distance to snap to first node when closing polygon
  paste_offset: 20              # Pixels - offset when pasting copied items

background:
  z_value: -100                 # Rendering layer order (background is bottom layer)

object:
  width: 0.04                   # Meters - OBB border line width in scene coordinates (4cm)
  z_value: 45                   # Rendering layer order (above room=40, below wall=50)
  handle_size: 0.1              # Meters - corner/rotate handle size in scene coordinates (10cm)
  rotation_handle_offset: 0.5   # Meters - rotation handle distance from OBB top edge
  label_scale: 0.02             # Scale factor for object label text

custom_polygon:
  width: 0.04                   # Meters - border line width in scene coordinates (4cm)
  z_value: 42                   # Rendering layer order (above room=40, below object=45)
  rotation_handle_offset: 0.5   # Meters - rotation handle distance from centroid
  label_scale: 0.02             # Scale factor for custom polygon label text

polygon_handle:
  size: 0.1           # Meters - rotation handle size
  pen_width: 0.01     # Meters - rotation handle outline width

viewer_3d:
  font_size: 12       # Points - placeholder text font size
  voxel_size: 0.05    # Meters - downsample voxel size for 3D preview during slider drag (0 to disable)

window:
  width: 1400         # Pixels - initial window width
  height: 900         # Pixels - initial window height
  splitter_left: 550  # Pixels - left panel initial width (3D viewer)
  splitter_right: 550 # Pixels - right panel initial width (2D canvas)

coordinate_system:
  default_preset: "ros"           # Default preset: "ros", "opencv", "opengl", "custom"

snap:
  enabled: true                   # Master toggle for snapping (Shift key toggles temporarily)
  angle_threshold: 5.0            # Degrees — angle must be within this to trigger snap
  alignment_tolerance: 5          # Pixels — screen-space distance to trigger alignment snap
  angle_set: [0, 90, 180, 270]   # Global snap angles in degrees (H/V)
  relative_snap: true             # Enable snapping parallel/perpendicular to existing edges
  relative_offsets: [0, 90]       # Relative angle offsets (0=parallel, 90=perpendicular)
  guide_z_value: 200              # Rendering layer for guide lines (above all annotations)

occupancy_grid:
  block_height: 0.3              # Meters - occupied cell block height for 3D visualization

annotation_3d:
  wall_height: 1.5              # Meters - virtual wall height for 3D visualization
  floor_z_level: 0.0            # Z level for room floor planes (legacy, superseded by coordinate_system.floor_level)
  enable_room_planes: true      # Toggle room polygon planes in 3D viewer
  enable_wall_geometry: true    # Toggle virtual wall planes in 3D viewer
  enable_custom_polygon_planes: true  # Toggle custom polygon planes in 3D viewer
  enable_object_boxes: true     # Toggle object OBB boxes in 3D viewer
  object_height: 0.5            # Meters - virtual object box height


autosave:
  enabled: true          # Default: auto-save enabled (overridden by QSettings at runtime)
  interval_minutes: 5    # Default interval in minutes (overridden by QSettings at runtime)

# Map Alignment Tool (src/map_align/)
map_align:
  display:
    voxel_size: 0.05                    # Meters — downsample for display performance
  occupancy_grid:
    wall_height: 2.0                    # Meters — occupied cell extrusion height for 3D alignment
  view:
    initial_scale: 50.0                 # Pixels per meter — initial zoom level
    min_scale: 1.0                      # Minimum zoom (pixels per meter)
    max_scale: 10000.0                  # Maximum zoom (pixels per meter)
    zoom_factor: 1.1                    # Zoom multiplier per scroll notch
  step_sizes:
    translate_default: 0.1              # Meters — arrow key nudge step
    translate_min: 0.01                 # Meters — minimum translate step spinbox value
    translate_max: 10.0                 # Meters — maximum translate step spinbox value
    rotate_default: 5.0                 # Degrees — rotation key step
    rotate_min: 0.5                     # Degrees — minimum rotation step spinbox value
    rotate_max: 45.0                    # Degrees — maximum rotation step spinbox value
  icp:
    max_correspondence_distance: 0.5    # Meters — maximum point pairing distance
    max_iterations: 200                 # Maximum ICP iterations
  ui:
    panel_width: 260                    # Pixels — controls panel width
  renderer:
    point_size: 3.0                     # Point size for unlit point cloud material
    camera_fov: 60.0                    # Degrees — default camera field of view
    camera_eye: [0.0, -20.0, 15.0]     # Default camera eye position
    camera_center: [0.0, 0.0, 0.0]     # Default camera look-at center
    camera_up: [0.0, 0.0, 1.0]         # Default camera up vector
    camera_fit_coefficient: 0.8         # Camera fit distance coefficient
    axes_line_width: 3.0               # Line width for XYZ axes
    grid_line_width: 1.0               # Line width for grid lines
    axes_min_size: 0.5                 # Minimum axes size threshold
    axes_fallback_size: 1.0            # Fallback axes size when below minimum
    grid_min_extent: 1.0               # Minimum grid extent threshold
    grid_fallback_extent: 20.0         # Fallback grid extent when below minimum
